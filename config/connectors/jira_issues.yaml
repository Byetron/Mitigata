connector: jira_issues
source: jira
enabled: true
schedule: "*/30 * * * *"
base_url: ${JIRA_BASE_URL}
auth:
  type: basic
  username_env: JIRA_EMAIL
  secret: JIRA_API_TOKEN
headers:
  Accept: application/json
endpoints:
  - name: issues
    method: GET
    # /rest/api/3/search was retired by Atlassian; /search/jql uses token paging (spec 2.5, section 11).
    path: /rest/api/3/search/jql
    params:
      maxResults: 50
      fields: "summary,issuetype,priority,created,updated"
    records_path: issues
    pagination:
      type: cursor
      param: nextPageToken
      next_path: nextPageToken
    incremental:
      cursor_field: fields.updated
      param: jql
      format: 'updated >= "{value}" ORDER BY updated ASC'
      initial: "2026-01-01 00:00"
      cursor_format: "%Y-%m-%d %H:%M"   # JQL does not accept ISO timestamps with offsets
      lookback_minutes: 720              # JQL reads times in the account time zone; overlap is safe (upserts)
    mapping:
      target: event
      fields:
        id:          { from: key, required: true }
        type:        { from: fields.issuetype.name, default: task }
        severity:    { from: fields.priority.name, transform: lower, default: unknown }
        timestamp:   { from: fields.created, transform: iso8601, required: true }
        description: { from: fields.summary, default: "" }
