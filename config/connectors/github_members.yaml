connector: github_members
source: github
enabled: true
schedule: "0 * * * *"
base_url: https://api.github.com
auth:
  type: bearer
  secret: GITHUB_TOKEN
headers:
  Accept: application/vnd.github+json
  X-GitHub-Api-Version: "2022-11-28"
endpoints:
  - name: members
    method: GET
    path: /orgs/{org}/members
    vars:
      org: YOUR_ORG_LOGIN   # replace with an org your token belongs to
    params:
      per_page: 100
    records_path: ""
    pagination:
      type: link_header
      rel: next
    mapping:
      target: user
      fields:
        id:         { from: login, required: true }
        name:       { from: login, default: "" }
        email:      { const: null }
        status:     { const: active }
        last_login: { const: null }
