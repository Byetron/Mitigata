# Hermes connector: fill in the parts marked 1 to 4, then check it with:  hermes validate
# First store your API key (skip if the service needs no key):  hermes secret set MY_API_KEY

# 1. About this connector
connector: my_connector              # a short name: lowercase letters, numbers and _ only
source: my_source                    # a label that will appear next to every record
schedule: "0 * * * *"                # how often to run. This one means: every hour
base_url: https://api.example.com    # the service's address. Must start with https://

# 2. How to log in
auth:
  type: bearer                       # bearer = the key is sent as a token.   Use "none" if no key is needed
  secret: MY_API_KEY                 # the NAME of your stored key. Never paste the key itself here

# 3. What to download
endpoints:
  - name: items                      # any name
    path: /v1/items                  # the part of the address that comes after base_url
    records_path: data               # where the list is in the reply. Use "" if the reply IS the list

    # 4. Which fields to keep (left side = our name, "from" = the service's name)
    mapping:
      target: event                  # event, user or device
      fields:
        id:        { from: id, required: true }
        timestamp: { from: created_at, transform: iso8601, required: true }
        severity:  { from: severity, default: unknown }

# That is all you need. More options (several pages of results, a health check, extra headers):
# see docs/connector-options.md
