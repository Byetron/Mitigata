name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # A throwaway 32-byte key (64 hex chars). Headless runners have no OS keychain.
      SECINTEGRATE_MASTER_KEY: ${{ secrets.SECINTEGRATE_MASTER_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy (strict)
        run: mypy
      - name: Tests
        run: pytest -rA 2>&1 | tee test-output.txt
      - name: Secret scan (X-6)
        run: bash scripts/secret_scan.sh
